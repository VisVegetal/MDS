<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Course Catalog{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col">

    <nav class="bg-white shadow-md border-b border-gray-200">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="{% url 'course_list' %}" class="text-xl font-bold text-indigo-600 hover:text-indigo-800 transition">
                📚 CourseCatalog
            </a>
            <div class="flex items-center space-x-4 font-medium">
                <a href="{% url 'course_list' %}" class="text-gray-600 hover:text-indigo-600 transition">All Courses</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'course_create' %}" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 shadow-sm transition">
                        + Add Course
                    </a>
                    <span class="text-sm text-gray-500 bg-gray-100 px-3 py-1 rounded-full">👤 {{ user.username }}</span>
                    <a href="{% url 'logout' %}" class="text-red-500 hover:text-red-700 transition">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="text-indigo-600 border border-indigo-600 px-4 py-2 rounded-lg hover:bg-indigo-50 transition">
                        Login
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="max-w-5xl w-full mx-auto px-4 py-8 flex-grow">
        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-100">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="text-center py-6 text-sm text-gray-400 mt-auto border-t border-gray-100 bg-white">
        &copy; 2026 MDS Lab 3 - MVC Catalog
    </footer>

</body>
</html>
