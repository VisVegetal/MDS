{% extends "courses/base.html" %}
{% block content %}
<h1>Delete Course</h1>
<p>Are you sure you want to delete the course "{{ course.title }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" style="color: red; font-weight: bold;">Yes, confirm delete</button> | 
    <a href="{% url 'course_detail' course.pk %}">Cancel</a>
</form>
{% endblock %}
